[project]
name = "systemverilog-fp-unit"
version = "0.1.0"
description = "Verification environment (cocotb, Verilator, bit-exact Python oracle) of a parameterized IEEE 754-2019 floating-point unit in SystemVerilog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 1.9.x required for Verilator 5.020 (cocotb 2.x needs Verilator >= 5.036).
    "cocotb>=1.9.2,<2",
]
